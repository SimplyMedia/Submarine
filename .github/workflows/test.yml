name: Test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Submarine.slnx
        working-directory: backend
      - name: Build
        run: dotnet build Submarine.slnx --no-restore -c Release /p:ContinuousIntegrationBuild=true
        working-directory: backend
      - name: Test
        run: |
          for project in tests/*/*.csproj; do
            dotnet run --project "$project" -c Release --no-build -p:OpenApiGenerateDocumentsOnBuild=false
          done
        working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: OpenAPI drift
        run: |
          git diff --exit-code -- backend/openapi.json
          cd frontend && corepack enable && pnpm install --frozen-lockfile && pnpm generate:api
          git diff --exit-code -- app/types/api.d.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm generate

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - name: Build the UI into the API
        run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm generate
          rm -rf ../backend/src/Submarine.Api/wwwroot && cp -r .output/public ../backend/src/Submarine.Api/wwwroot
      - name: Publish the API
        run: dotnet publish backend/src/Submarine.Api -c Release -o /tmp/submarine-api -p:OpenApiGenerateDocumentsOnBuild=false
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the stack and the suite
        run: |
          node e2e/stack.mjs start
          E2E_BASE_URL=http://localhost:8989 pnpm e2e
        working-directory: frontend
        env:
          SUBMARINE_API_DIR: /tmp/submarine-api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results

  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: submarine
            dockerfile: backend/src/Submarine.Api/Dockerfile
            context: .
          - image: submarine-metadata
            dockerfile: backend/src/Submarine.Metadata/Dockerfile
            context: backend
          - image: submarine-mappings
            dockerfile: backend/src/Submarine.Mappings/Dockerfile
            context: backend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simplymedia/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

