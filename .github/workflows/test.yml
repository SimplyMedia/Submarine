name: Test

# develop, master and version tags run these tests through build.yml, which publishes images afterwards.
on:
  push:
    branches-ignore: [develop, master]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Submarine.slnx
        working-directory: backend
      - name: Build
        run: dotnet build Submarine.slnx --no-restore -c Release /p:ContinuousIntegrationBuild=true
        working-directory: backend
      - name: Test
        run: |
          for project in tests/*/*.csproj; do
            dotnet run --project "$project" -c Release --no-build -p:OpenApiGenerateDocumentsOnBuild=false
          done
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: OpenAPI drift
        run: |
          git diff --exit-code -- backend/openapi.json
          cd frontend && corepack enable && pnpm install --frozen-lockfile && pnpm generate:api
          git diff --exit-code -- app/types/api.d.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm generate

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Build the UI into the API
        run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm generate
          rm -rf ../backend/src/Submarine.Api/wwwroot && cp -r .output/public ../backend/src/Submarine.Api/wwwroot
      - name: Publish the API
        run: dotnet publish backend/src/Submarine.Api -c Release -o /tmp/submarine-api -p:OpenApiGenerateDocumentsOnBuild=false
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the stack and the suite
        run: |
          node e2e/stack.mjs start
          E2E_BASE_URL=http://localhost:8989 pnpm e2e
        working-directory: frontend
        env:
          SUBMARINE_API_DIR: /tmp/submarine-api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
