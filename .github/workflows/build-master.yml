name: Build Docker Images

on:
  push:
    branches: [master]
    paths:
      - backend/Submarine.Api/**
      - backend/Submarine.Core/**
      - backend/Submarine.Metadata/**
      - backend/Submarine.Metadata.Contracts/**
      - backend/Submarine.Mappings/**
      - backend/Submarine.Mappings.Contracts/**
      - .github/workflows/build-master.yml

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: api
            dockerfile: ./backend/Submarine.Api/Dockerfile
            image: submarine-api
          - project: metadata
            dockerfile: ./backend/Submarine.Metadata/Dockerfile
            image: submarine-metadata
          - project: mappings
            dockerfile: ./backend/Submarine.Mappings/Dockerfile
            image: submarine-mappings
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short hash of commit
        id: sha_short
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/simplymedia/${{ matrix.image }}:${{ steps.sha_short.outputs.sha_short }}
            ghcr.io/simplymedia/${{ matrix.image }}:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
