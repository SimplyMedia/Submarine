services:
  submarine-api:
    build:
      context: backend
      dockerfile: Submarine.Api/Dockerfile
    ports:
      - "8989:8080"
    volumes:
      - ./data/api:/app/data
    environment:
      Metadata__BaseUrl: http://submarine-metadata:8080
      Mappings__BaseUrl: http://submarine-mappings:8080
    depends_on:
      - submarine-metadata
      - submarine-mappings

  submarine-metadata:
    build:
      context: backend
      dockerfile: Submarine.Metadata/Dockerfile
    ports:
      - "8990:8080"
    environment:
      Tmdb__ApiKey: ${TMDB_API_KEY:-}
      Tvdb__ApiKey: ${TVDB_API_KEY:-}

  submarine-mappings:
    build:
      context: backend
      dockerfile: Submarine.Mappings/Dockerfile
    ports:
      - "8991:8080"
    volumes:
      - ./data/mappings:/app/data

