# Builds Submarine and its services from source. To run the published images, use examples/docker-compose.yml.
#   docker compose up -d --build

services:
  submarine:
    build:
      context: .
      dockerfile: backend/src/Submarine.Api/Dockerfile
    ports:
      - "8989:8080"
    environment:
      Metadata__BaseUrl: http://submarine-metadata:8080
      Metadata__ApiKey: dev-internal-key
      Mappings__BaseUrl: http://submarine-mappings:8080
      Mappings__ApiKey: dev-internal-key
    volumes:
      - ./data/submarine:/config
    depends_on:
      submarine-metadata:
        condition: service_healthy
      submarine-mappings:
        condition: service_healthy

  submarine-metadata:
    build:
      context: backend
      dockerfile: src/Submarine.Metadata/Dockerfile
    environment:
      Auth__ApiKey: dev-internal-key
      Tmdb__ApiKey: ${TMDB_API_KEY:-}
      Tvdb__ApiKey: ${TVDB_API_KEY:-}
      Tvdb__Pin: ${TVDB_PIN:-}

  submarine-mappings:
    build:
      context: backend
      dockerfile: src/Submarine.Mappings/Dockerfile
    environment:
      Auth__AdminApiKey: dev-internal-key
    volumes:
      - ./data/mappings:/config
