# Disposable integration smoke: run from the repository root with
# docker compose -f tests/compat-smoke/docker-compose.yml -p compat-smoke up -d --build
name: compat-smoke

services:
  submarine:
    build:
      context: ../..
      dockerfile: backend/src/Submarine.Api/Dockerfile
    container_name: compat-int-submarine
    ports:
      - "18955:8080"
    environment:
      Metadata__BaseUrl: http://compat-int-metadata:8080
      Metadata__ApiKey: smoke-internal-key
      Mappings__BaseUrl: http://compat-int-mappings:8080
      Mappings__ApiKey: smoke-internal-key
    volumes:
      - smoke-submarine-config:/config
      - smoke-media:/media
    depends_on:
      submarine-metadata:
        condition: service_healthy
      submarine-mappings:
        condition: service_healthy

  submarine-metadata:
    build:
      context: ../../backend
      dockerfile: src/Submarine.Metadata/Dockerfile
    container_name: compat-int-metadata
    environment:
      Auth__ApiKey: smoke-internal-key
      Tmdb__ApiKey: ${TMDB_API_KEY:-}

  submarine-mappings:
    build:
      context: ../../backend
      dockerfile: src/Submarine.Mappings/Dockerfile
    container_name: compat-int-mappings
    environment:
      Auth__AdminApiKey: smoke-internal-key
    volumes:
      - smoke-mappings-config:/config

  bazarr:
    image: ghcr.io/linuxserver/bazarr:1.6.1
    container_name: compat-int-bazarr
    ports:
      - "18956:6767"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - smoke-bazarr-config:/config
      - smoke-media:/media
    depends_on:
      - submarine

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.0
    container_name: compat-int-recyclarr
    profiles: [consumers]
    volumes:
      - ./recyclarr:/config
    depends_on:
      - submarine

volumes:
  smoke-submarine-config:
  smoke-mappings-config:
  smoke-bazarr-config:
  smoke-media:
