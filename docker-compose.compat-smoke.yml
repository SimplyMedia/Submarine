# Real Docker smoke for the Radarr v3 compatibility facade: builds Submarine from source and runs
# it alongside pinned Overseerr 1.35.0 and Bazarr 1.6.1 on an isolated network. Throwaway
# config/database/media volumes; not for production use.
#   docker compose -f docker-compose.compat-smoke.yml -p compat-radarr-smoke up -d --build
name: compat-radarr-smoke

services:
  submarine:
    build:
      context: .
      dockerfile: backend/src/Submarine.Api/Dockerfile
    container_name: compat-radarr-submarine
    ports:
      - "18953:8080"
    environment:
      Metadata__BaseUrl: http://compat-radarr-metadata:8080
      Metadata__ApiKey: smoke-internal-key
      Mappings__BaseUrl: http://compat-radarr-mappings:8080
      Mappings__ApiKey: smoke-internal-key
    volumes:
      - smoke-submarine-config:/config
      - smoke-media:/media
    depends_on:
      submarine-metadata:
        condition: service_healthy
      submarine-mappings:
        condition: service_healthy

  submarine-metadata:
    build:
      context: backend
      dockerfile: src/Submarine.Metadata/Dockerfile
    container_name: compat-radarr-metadata
    environment:
      Auth__ApiKey: smoke-internal-key
      Tmdb__ApiKey: ${TMDB_API_KEY:-}

  submarine-mappings:
    build:
      context: backend
      dockerfile: src/Submarine.Mappings/Dockerfile
    container_name: compat-radarr-mappings
    environment:
      Auth__AdminApiKey: smoke-internal-key
    volumes:
      - smoke-mappings-config:/config

  overseerr:
    image: ghcr.io/sct/overseerr:1.35.0
    container_name: compat-radarr-overseerr
    ports:
      - "18954:5055"
    environment:
      TZ: Etc/UTC
    volumes:
      - smoke-overseerr-config:/app/config
    depends_on:
      - submarine

  bazarr:
    image: ghcr.io/linuxserver/bazarr:1.6.1
    container_name: compat-radarr-bazarr
    ports:
      - "18955:6767"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - smoke-bazarr-config:/config
      - smoke-media:/media
    depends_on:
      - submarine

volumes:
  smoke-submarine-config:
  smoke-mappings-config:
  smoke-overseerr-config:
  smoke-bazarr-config:
  smoke-media:
